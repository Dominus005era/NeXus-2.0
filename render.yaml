services:
  - type: web
    name: nexus-backend-v2
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SWARM_ORCHESTRATOR_API_KEY
        sync: false
      - key: SALES_INTELLIGENCE_API_KEY
        sync: false
      - key: INVENTORY_SUPPLY_API_KEY
        sync: false
      - key: TREASURY_FINANCE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false